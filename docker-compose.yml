# Local dependency for trellis-app: MongoDB as a single-node replica set (needed for transactions).
# Browse the data with MongoDB Compass: mongodb://localhost:27017/?directConnection=true
services:
  mongo:
    image: mongo:7.0
    container_name: trellis-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - trellis-mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once this node is primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

volumes:
  trellis-mongo-data:
