# Local dependencies for Trellis: MongoDB (single-node replica set, needed for transactions) and mongo-express.
services:
  mongo:
    image: mongo:7.0
    container_name: trellis-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - trellis-mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once this node is primary.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: trellis-mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: "false"

volumes:
  trellis-mongo-data:
