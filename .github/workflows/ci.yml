name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read          # download Trellis from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-trellis       # matches the <repository> id in pom.xml
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      # Each Trellis package must grant this repository access:
      # package page -> Package settings -> Manage Actions access -> add trellis-app.
      - name: Build and test
        run: ./mvnw -B -ntp verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
