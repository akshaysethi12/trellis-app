name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-trellis       # matches the <repository> id in pom.xml
          server-username: GITHUB_ACTOR
          server-password: TRELLIS_PACKAGES_TOKEN
      # Trellis is a Maven package in another private repository. GITHUB_TOKEN can only read packages
      # of this repository, so the build uses a personal access token (classic) with read:packages,
      # stored as the repository secret TRELLIS_PACKAGES_TOKEN.
      - name: Build and test
        run: ./mvnw -B -ntp verify
        env:
          TRELLIS_PACKAGES_TOKEN: ${{ secrets.TRELLIS_PACKAGES_TOKEN }}
