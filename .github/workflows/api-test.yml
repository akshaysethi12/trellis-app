# Starts MongoDB and the app, then runs the Postman collection against it.
# Failures are reported as annotations on the run, so they show on the pull request.
name: API test

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-trellis
          server-username: GITHUB_ACTOR
          server-password: TRELLIS_PACKAGES_TOKEN

      - name: Build
        run: ./mvnw -B -ntp -DskipTests package
        env:
          TRELLIS_PACKAGES_TOKEN: ${{ secrets.TRELLIS_PACKAGES_TOKEN }}

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          until docker exec mongo mongosh --quiet --eval 1 >/dev/null 2>&1; do sleep 2; done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          until [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = "true" ]; do sleep 2; done

      - name: Start the app
        run: |
          nohup java -jar target/trellis-app-*.jar > app.log 2>&1 &
          for i in $(seq 1 90); do curl -fs http://localhost:8080/actuator/health >/dev/null && exit 0; sleep 2; done
          echo "::error title=App did not start::$(grep -m1 -E 'APPLICATION FAILED|Exception' app.log)"
          exit 1

      - name: Run the Postman collection
        working-directory: postman
        run: npx -y newman@6 run Trellis.postman_collection.json --reporters cli,json --reporter-json-export ../newman.json --color off

      - name: Report failures
        if: always()
        run: |
          if [ -f newman.json ]; then
            node -e '
              const run = require("./newman.json").run;
              const s = run.stats;
              console.log(`::notice title=Postman::${s.requests.total} requests, ${s.assertions.total} assertions, ${s.assertions.failed} failed`);
              run.failures.slice(0, 9).forEach(f =>
                console.log(`::error title=${(f.source && f.source.name || "request").replace(/[:,]/g, " ")}::${(f.error.test || f.error.name)} - ${f.error.message}`));
            '
          fi
          grep -E "ERROR|Exception:" app.log | grep -v "UnauthorizedException" | sort -u | head -5 | while read -r line; do echo "::warning title=app.log::${line:0:300}"; done || true
